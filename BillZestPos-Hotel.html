<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BillZestPos — Hotel Room View</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; color: #0f172a; min-height: 100vh; }
    .top {
      background: #1e293b; color: #fff; padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    .top h1 { font-size: 1.15rem; font-weight: 700; }
    .top a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; margin-left: 14px; }
    .top a:hover { color: #2dd4bf; }
    .legend {
      display: flex; flex-wrap: wrap; gap: 14px; padding: 12px 20px; background: #fff;
      border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; align-items: center;
    }
    .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: 4px; }
    .floors { display: flex; gap: 8px; padding: 12px 20px; flex-wrap: wrap; }
    .floors button {
      padding: 8px 16px; border-radius: 8px; border: 1px solid #e2e8f0;
      background: #fff; cursor: pointer; font-weight: 600; font-family: inherit;
    }
    .floors button.active { background: #0f766e; color: #fff; border-color: #0f766e; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px; padding: 0 20px 24px;
    }
    .card {
      background: #fff; border-radius: 10px; border: 2px solid #e2e8f0;
      padding: 12px; min-height: 110px; cursor: pointer; transition: 0.15s;
      display: flex; flex-direction: column;
    }
    .card:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
    .card.vacant { border-top: 4px solid #22c55e; }
    .card.occupied { border-top: 4px solid #3b82f6; background: #eff6ff; }
    .card.reserved { border-top: 4px solid #a855f7; background: #faf5ff; }
    .card.dirty { border-top: 4px solid #f59e0b; background: #fffbeb; }
    .card.ooo { border-top: 4px solid #ef4444; background: #fef2f2; }
    .card .num { font-weight: 800; font-size: 1.2rem; }
    .card .type { font-size: 0.75rem; color: #64748b; }
    .card .guest { font-size: 0.85rem; margin-top: 8px; flex: 1; font-weight: 500; }
    .card .price { font-size: 0.8rem; color: #0f766e; font-weight: 600; }
    .side {
      display: grid; grid-template-columns: 1fr 320px; gap: 16px;
      padding: 0 20px 40px; max-width: 1400px; margin: 0 auto;
    }
    @media (max-width: 900px) { .side { grid-template-columns: 1fr; } }
    .panel {
      background: #fff; border-radius: 16px; border: 1px solid #e2e8f0;
      padding: 20px; height: fit-content; position: sticky; top: 12px;
    }
    .panel h3 { font-size: 1rem; margin-bottom: 14px; }
    .panel label { display: block; font-size: 0.8rem; font-weight: 600; margin: 10px 0 4px; color: #64748b; }
    .panel input, .panel select {
      width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px;
      font-family: inherit; font-size: 0.95rem;
    }
    .btn {
      width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: 10px;
      background: #0f766e; color: #fff; font-weight: 700; font-size: 0.95rem;
      cursor: pointer; font-family: inherit;
    }
    .btn:hover { background: #0d9488; }
    .btn-outline {
      background: #fff; color: #0f766e; border: 1px solid #0f766e; margin-top: 8px;
    }
    .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-left: auto; font-size: 0.85rem; }
    .stats b { color: #0f766e; }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1>🏨 BillZestPos — Hotel Room View</h1>
    </div>
    <div>
      <a href="BillZestPos-Hub.html">← Modules</a>
      <a href="BillZestPos-Admin.html">Admin</a>
      <a href="BillZestPos-POS.html?mode=hotel">Room Service POS</a>
    </div>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:#22c55e"></span> Vacant</span>
    <span><span class="dot" style="background:#3b82f6"></span> Occupied</span>
    <span><span class="dot" style="background:#a855f7"></span> Reserved</span>
    <span><span class="dot" style="background:#f59e0b"></span> Dirty</span>
    <span><span class="dot" style="background:#ef4444"></span> Out of Order</span>
    <div class="stats" id="stats"></div>
  </div>
  <div class="floors" id="floors"></div>
  <div class="side">
    <div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="panel">
      <h3 id="panelTitle">Select a room</h3>
      <label>Guest Name</label>
      <input id="guest" placeholder="Guest name">
      <label>Phone</label>
      <input id="phone" value="+966550898978">
      <label>Check-in</label>
      <input type="date" id="checkIn">
      <label>Check-out</label>
      <input type="date" id="checkOut">
      <label>Nights</label>
      <input type="number" id="nights" value="1" min="1">
      <label>Status</label>
      <select id="status">
        <option value="vacant">Vacant</option>
        <option value="occupied">Occupied (Check-in)</option>
        <option value="reserved">Reserved</option>
        <option value="dirty">Dirty</option>
        <option value="ooo">Out of Order</option>
      </select>
      <button class="btn" onclick="saveRoom()">Save Room / Booking</button>
      <button class="btn btn-outline" onclick="addRoomCharge()">Add 1 Night to POS Cart →</button>
    </div>
  </div>
  <script>
    const DB_KEY = 'billzestpos_admin_v1';
    let rooms = [], selected = null, floor = 'ALL';

    function load() {
      try {
        const d = JSON.parse(localStorage.getItem(DB_KEY) || '{}');
        rooms = d.rooms || [];
        if (!rooms.length) {
          rooms = [
            { id:1, number:'101', type:'Deluxe', floor:'First Floor', price:350, guest:'', status:'vacant' },
            { id:2, number:'102', type:'Deluxe', floor:'First Floor', price:350, guest:'Ahmed Ali', status:'occupied' },
            { id:3, number:'103', type:'Standard', floor:'First Floor', price:250, guest:'', status:'vacant' },
            { id:4, number:'104', type:'Standard', floor:'First Floor', price:250, guest:'', status:'reserved' },
            { id:5, number:'201', type:'Suite', floor:'Second Floor', price:650, guest:'', status:'vacant' },
            { id:6, number:'202', type:'Deluxe', floor:'Second Floor', price:400, guest:'', status:'dirty' },
            { id:7, number:'301', type:'Suite', floor:'Top Floor', price:800, guest:'', status:'vacant' }
          ];
          saveDB();
        }
      } catch(e) { rooms = []; }
      render();
    }
    function saveDB() {
      let d = {};
      try { d = JSON.parse(localStorage.getItem(DB_KEY) || '{}'); } catch(e) {}
      d.rooms = rooms;
      localStorage.setItem(DB_KEY, JSON.stringify(d));
    }
    function render() {
      const floors = ['ALL', ...new Set(rooms.map(r => r.floor || 'Main'))];
      document.getElementById('floors').innerHTML = floors.map(f =>
        `<button class="${floor===f?'active':''}" onclick="floor='${f}';render()">${f}</button>`
      ).join('');
      const list = floor === 'ALL' ? rooms : rooms.filter(r => (r.floor||'Main') === floor);
      document.getElementById('grid').innerHTML = list.map(r => {
        const st = (r.status||'vacant').toLowerCase();
        return `<div class="card ${st}" onclick="selectRoom(${r.id})">
          <div class="num">${r.number}</div>
          <div class="type">${r.type||''} · ${r.floor||''}</div>
          <div class="guest">${r.guest || '—'}</div>
          <div class="price">SAR ${Number(r.price||0)} / night</div>
        </div>`;
      }).join('');
      const c = { vacant:0, occupied:0, reserved:0, dirty:0, ooo:0 };
      rooms.forEach(r => {
        const s = (r.status||'vacant').toLowerCase();
        if (c[s] !== undefined) c[s]++; else c.ooo++;
      });
      document.getElementById('stats').innerHTML =
        `<span>Total <b>${rooms.length}</b></span> <span>Vacant <b>${c.vacant}</b></span> <span>Occupied <b>${c.occupied}</b></span>`;
    }
    function selectRoom(id) {
      selected = rooms.find(r => r.id === id);
      if (!selected) return;
      document.getElementById('panelTitle').textContent = 'Room ' + selected.number + ' · ' + (selected.type||'');
      document.getElementById('guest').value = selected.guest || '';
      document.getElementById('status').value = selected.status || 'vacant';
      document.getElementById('nights').value = 1;
    }
    function saveRoom() {
      if (!selected) return alert('Select a room first');
      selected.guest = document.getElementById('guest').value.trim();
      selected.status = document.getElementById('status').value;
      const phone = document.getElementById('phone').value;
      const nights = parseInt(document.getElementById('nights').value)||1;
      const checkIn = document.getElementById('checkIn').value;
      const checkOut = document.getElementById('checkOut').value;
      if (selected.status === 'occupied' || selected.status === 'reserved') {
        let d = {};
        try { d = JSON.parse(localStorage.getItem(DB_KEY)||'{}'); } catch(e) {}
        if (!d.bookings) d.bookings = [];
        d.bookings.push({
          id: Date.now(), code: 'BK-'+String(Date.now()).slice(-6),
          roomId: selected.id, roomNo: selected.number,
          guest: selected.guest, phone, checkIn, checkOut, nights,
          total: Number(selected.price||0)*nights, status: selected.status === 'occupied' ? 'checked_in' : 'confirmed'
        });
        d.rooms = rooms;
        localStorage.setItem(DB_KEY, JSON.stringify(d));
      } else {
        saveDB();
      }
      render();
      alert('Saved');
    }
    function addRoomCharge() {
      if (!selected) return alert('Select a room');
      const nights = parseInt(document.getElementById('nights').value)||1;
      const item = {
        id: 'room-'+selected.id, name: 'Room '+selected.number+' × '+nights+' night(s)',
        price: Number(selected.price||0)*nights, qty: 1
      };
      sessionStorage.setItem('bz_hotel_charge', JSON.stringify(item));
      window.location.href = 'BillZestPos-POS.html?mode=hotel';
    }
    load();
  </script>
</body>
</html>
