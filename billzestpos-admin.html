<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>BillZestPOS Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%23f4a300'/%3E%3Cpath d='M8 6h12v16l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L8 22z' fill='%2314213d'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--surface:#fff;--ink:#14213d;--muted:#5b6478;--line:#dfe3ec;--accent:#f4a300;--accent-ink:#14213d;--ok:#12805c;--bad:#c0392b;--warn:#8a5a00;--dark:#14213d;--r:14px;--rs:10px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--surface:#161e33;--ink:#eef1f8;--muted:#9aa4bc;--line:#26304a;--ok:#4cc79a;--bad:#ff8a7a;--warn:#f4b640;--dark:#1d2845}}
:root[data-theme="dark"]{--bg:#0e1424;--surface:#161e33;--ink:#eef1f8;--muted:#9aa4bc;--line:#26304a;--ok:#4cc79a;--bad:#ff8a7a;--warn:#f4b640;--dark:#1d2845}
*,*:before,*:after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}h2{font-size:20px;font-weight:700}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--dark);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.lg{display:flex;align-items:center;gap:9px;font:800 20px 'Bricolage Grotesque',sans-serif;padding:0 6px}
.lg b{color:var(--accent)}
nav{display:flex;flex-direction:column;gap:4px}
.nb{display:block;width:100%;padding:11px 12px;border:0;border-radius:var(--rs);background:transparent;color:#c9d1e6;font:inherit;font-weight:500;cursor:pointer;text-align:start;white-space:nowrap}
.nb:hover{background:rgba(255,255,255,.08)}
.nb[aria-current=page]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.vw{margin-top:auto;color:#c9d1e6;font-size:14px;padding:0 6px;white-space:nowrap}
main{padding:32px 24px 64px;min-width:0;max-width:1100px;width:100%}
.demo{background:color-mix(in srgb,var(--accent) 20%,transparent);border-radius:var(--rs);padding:10px 14px;font-size:14px;margin:0 0 22px}
.sub{color:var(--muted);margin:4px 0 22px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.kl{color:var(--muted);font-size:14px}
.kv{font:800 28px 'Bricolage Grotesque',sans-serif;margin-top:2px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;margin-top:14px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:14px;color:var(--muted)}
.bar i{display:block;flex:none;width:100%;background:var(--line);border-radius:6px 6px 0 0}
.bar.cur i{background:var(--accent)}
.li{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;align-items:end}
label{display:block;font-weight:600;font-size:14px}
input,select{display:block;width:100%;min-height:46px;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:var(--rs);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:16px;line-height:1.2;padding:12px 20px;border:1.5px solid var(--accent);border-radius:var(--rs);text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.alt:hover{border-color:var(--ink)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.bad{color:var(--bad)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0 16px}
.tb input{flex:1 1 200px;margin:0}.tb select{width:auto;margin:0}.tb .btn.sm{min-height:46px;font-size:16px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:12px;text-align:start;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
thead th{border-top:0;color:var(--muted);font-size:16px;font-weight:600}
td select{margin:0;min-height:40px;padding:8px 10px;font-size:16px;width:auto}
td{font-variant-numeric:tabular-nums}
td .btn.sm{min-height:40px;padding:8px 14px;font-size:16px}
td .pill{font-size:16px;padding:2px 12px}
.acts{display:flex;gap:8px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:14px;font-weight:600}
.p-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.p-warn{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.hint{font-size:14px;color:var(--muted);margin:12px 0 0}
.empty{padding:22px;color:var(--muted);text-align:center}
.ts{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:var(--rs);font-size:16px;z-index:9}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:100%;max-width:400px}
.login .lg{padding:0;margin-bottom:20px}
.login label{margin-bottom:16px}
.login .btn{width:100%;margin-top:4px}
.err{color:var(--bad);font-size:14px;margin:0 0 16px}
@media(max-width:820px){
.app{grid-template-columns:1fr}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;gap:8px;overflow-x:auto;padding:10px 12px;z-index:5}
.lg span{display:none}nav{flex-direction:row}.vw{margin:0 0 0 8px}
main{padding:20px 16px 64px}.card{padding:20px}
.kpis{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="login" id="lg" hidden><div class="card"><div class="lg"><svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#f4a300"/><path d="M8 6h12v16l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L8 22z" fill="#14213d"/><path d="M11 10h6M11 13.5h6" stroke="#f4a300" stroke-width="1.6" stroke-linecap="round"/></svg>BillZest<b>POS</b></div>
<h1>Admin sign in</h1><p class="sub">Only approved admins can enter.</p>
<form id="lf"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><p class="err" id="le" role="alert" hidden></p><button class="btn" type="submit">Sign in</button></form></div></div>
<div class="app" id="app">
<aside>
<div class="lg"><svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#f4a300"/><path d="M8 6h12v16l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L8 22z" fill="#14213d"/><path d="M11 10h6M11 13.5h6" stroke="#f4a300" stroke-width="1.6" stroke-linecap="round"/></svg><span>BillZest<b>POS</b></span></div>
<nav id="nv"><button class="nb" data-t="dash">Dashboard</button><button class="nb" data-t="cust">Customers</button><button class="nb" data-t="leads">Leads</button><button class="nb" data-t="offers">Offers</button><button class="nb" data-t="plans">Plans</button><button class="nb" data-t="set">Settings</button></nav>
<a class="vw" href="https://www.billzestpos.com/" target="_blank" rel="noopener">View website</a>
<button class="nb" id="so" type="button" hidden>Sign out</button>
</aside>
<main id="m"></main>
</div>
<div class="ts" id="ts" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
/* ===== SETTINGS: paste from Supabase > Project Settings > API (Project URL and anon public key) ===== */
var CFG={url:'',key:''};
var want=!!(CFG.url&&CFG.key),live=want&&!!window.supabase,sb=live?window.supabase.createClient(CFG.url,CFG.key):null;
var KEY='bz-admin-v1',T='dash',m=document.getElementById('m');
function d(n){var x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function seed(){return{
cust:[{id:'c1',name:'Green Valley Grocery',plan:'Business',cycle:'Monthly',status:'Active',renew:d(14),amt:251},
{id:'c2',name:'City Pharmacy',plan:'Business',cycle:'Yearly',status:'Active',renew:d(120),amt:167},
{id:'c3',name:'Corner Cafe',plan:'Business',cycle:'Monthly',status:'Trial',renew:d(6),amt:251},
{id:'c4',name:'Desert Wholesale',plan:'Enterprise',cycle:'Monthly',status:'Active',renew:d(25),amt:600},
{id:'c5',name:'Fresh Mart',plan:'Starter',cycle:'Monthly',status:'Active',renew:d(30),amt:0},
{id:'c6',name:'Sunrise Bakery',plan:'Business',cycle:'Monthly',status:'Suspended',renew:d(-9),amt:251}],
leads:[{id:'l1',name:'Sample lead 1',phone:'+966500000001',biz:'Restaurant',plan:'Business',status:'New',date:d(-1)},
{id:'l2',name:'Sample lead 2',phone:'+966500000002',biz:'Pharmacy',plan:'Demo',status:'Contacted',date:d(-3)}],
offers:[{id:'o1',code:'WELCOME10',pct:10,on:true},{id:'o2',code:'RAMADAN20',pct:20,on:false}],
plans:{bm:251,by:2000,disc:10},
set:{name:'BillZestPOS',phone:'+966550898978',email:'billzestai@gmail.com',vat:15}}}
var S=null;
if(want){var z=seed();S={cust:[],leads:[],offers:[],plans:z.plans,set:z.set}}
else{try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.cust)S=seed()}
function save(){if(want)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return 'SAR '+Math.round(n).toLocaleString('en-US')}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function fd(x){return new Date(x+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function pill(s){var c=(s==='Active'||s==='Won'||s==='On')?'p-ok':(s==='Suspended'||s==='Lost'||s==='Off')?'p-bad':'p-warn';return '<span class="pill '+c+'">'+esc(s)+'</span>'}
function sel(name,opts,cur){return '<select name="'+name+'">'+opts.map(function(o){return '<option'+(o===cur?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'}
var TT={dash:['Dashboard','How BillZestPOS is doing today.'],cust:['Customers','Businesses using your software.'],leads:['Leads','Requests from your website.'],offers:['Offers','Discount codes for new customers.'],plans:['Plans and prices','Keep your prices in one place.'],set:['Settings','Your business details.']};
function toast(t){var e=document.getElementById('ts');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2200)}

function dash(){
var act=S.cust.filter(function(c){return c.status==='Active'}),mrr=act.reduce(function(a,c){return a+(+c.amt||0)},0);
var tr=S.cust.filter(function(c){return c.status==='Trial'}).length,nl=S.leads.filter(function(l){return l.status==='New'}).length;
var k=[['Active customers',act.length],['Monthly revenue',money(mrr)],['On free trial',tr],['New leads',nl]];
var hist=[900,1300,1700,2100,2400,mrr],mx=Math.max.apply(null,hist)||1,now=new Date(),bars='';
hist.forEach(function(v,i){var dt=new Date(now.getFullYear(),now.getMonth()-(5-i),1);bars+='<div class="bar'+(i===5?' cur':'')+'"><span>'+Math.round(v)+'</span><i style="height:'+Math.max(4,Math.round(v/mx*110))+'px"></i><span>'+dt.toLocaleString('en',{month:'short'})+'</span></div>'});
var lim=d(14),ren=S.cust.filter(function(c){return c.status!=='Suspended'&&c.renew>=d(0)&&c.renew<=lim}).sort(function(a,b){return a.renew<b.renew?-1:1});
return '<div class="kpis">'+k.map(function(x){return '<div class="card"><div class="kl">'+x[0]+'</div><div class="kv">'+x[1]+'</div></div>'}).join('')+'</div>'+
'<div class="two"><div class="card"><h2>Monthly revenue (SAR)</h2><div class="chart">'+bars+'</div><p class="hint">Earlier months are sample numbers. The last bar is calculated from your active customers.</p></div>'+
'<div class="card"><h2>Renewing in 14 days</h2><div style="margin-top:8px">'+(ren.length?ren.map(function(c){return '<div class="li"><span>'+esc(c.name)+'</span><span style="color:var(--muted)">'+fd(c.renew)+'</span></div>'}).join(''):'<p class="hint">Nothing due soon.</p>')+'</div></div></div>'}

function crows(){
var q=(document.getElementById('cq')||{value:''}).value.toLowerCase(),st=(document.getElementById('cs')||{value:'All'}).value;
var r=S.cust.filter(function(c){return(st==='All'||c.status===st)&&c.name.toLowerCase().indexOf(q)>-1});
if(!r.length)return '<tr><td colspan="6" class="empty">No customers found.</td></tr>';
return r.map(function(c){return '<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.plan)+' · '+esc(c.cycle)+'</td><td>'+pill(c.status)+'</td><td>'+fd(c.renew)+'</td><td>'+money(c.amt)+'</td><td><div class="acts"><button class="btn alt sm" data-a="tog" data-id="'+c.id+'">'+(c.status==='Active'?'Suspend':'Activate')+'</button><button class="btn alt sm bad" data-a="delc" data-id="'+c.id+'">Delete</button></div></td></tr>'}).join('')}
function cust(){return '<div class="card"><form data-f="addc" class="fm"><label>Business name<input name="name" required maxlength="60"></label><label>Plan'+sel('plan',['Starter','Business','Enterprise'],'Business')+'</label><label>Billing'+sel('cycle',['Monthly','Yearly'],'Monthly')+'</label><label>Status'+sel('status',['Active','Trial'],'Trial')+'</label><label>SAR per month (optional)<input name="amt" type="number" min="0" step="1" inputmode="numeric"></label><button class="btn" type="submit">Add customer</button></form></div>'+
'<div class="tb"><input id="cq" placeholder="Search customers" aria-label="Search customers"><select id="cs" aria-label="Status"><option>All</option><option>Active</option><option>Trial</option><option>Suspended</option></select><button class="btn alt sm" data-a="exp" data-k="cust">Export CSV</button></div>'+
'<div class="tw"><table><thead><tr><th>Business</th><th>Plan</th><th>Status</th><th>Renews</th><th>Per month</th><th></th></tr></thead><tbody id="ctb">'+crows()+'</tbody></table></div>'}

function leads(){var rows=S.leads.length?S.leads.map(function(l){return '<tr><td><b>'+esc(l.name)+'</b></td><td>'+esc(l.phone)+'</td><td>'+esc(l.biz)+' · '+esc(l.plan)+'</td><td>'+fd(l.date)+'</td><td><select data-s="lead" data-id="'+l.id+'" aria-label="Lead status">'+['New','Contacted','Won','Lost'].map(function(o){return '<option'+(o===l.status?' selected':'')+'>'+o+'</option>'}).join('')+'</select></td><td><div class="acts"><a class="btn alt sm" target="_blank" rel="noopener" href="https://wa.me/'+esc(String(l.phone).replace(/\D/g,''))+'">WhatsApp</a><button class="btn alt sm bad" data-a="dell" data-id="'+l.id+'">Delete</button></div></td></tr>'}).join(''):'<tr><td colspan="6" class="empty">No leads yet.</td></tr>';
return '<div class="card"><form data-f="addl" class="fm"><label>Name<input name="name" required maxlength="60"></label><label>Phone<input name="phone" type="tel" required maxlength="20"></label><label>Business type<input name="biz" maxlength="40"></label><label>Plan interest'+sel('plan',['Demo','Starter','Business','Enterprise'],'Demo')+'</label><button class="btn" type="submit">Add lead</button></form></div>'+
'<div class="tb"><button class="btn alt sm" data-a="exp" data-k="leads">Export CSV</button></div><div class="tw"><table><thead><tr><th>Name</th><th>Phone</th><th>Business</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
'<p class="hint">'+(want?'New requests from your website form appear here automatically.':'Requests from the website form arrive on your WhatsApp or email. Add them here to track them.')+'</p>'}

function offers(){var rows=S.offers.length?S.offers.map(function(o){return '<tr><td><b>'+esc(o.code)+'</b></td><td>'+esc(o.pct)+'% off first payment</td><td>'+pill(o.on?'On':'Off')+'</td><td><div class="acts"><button class="btn alt sm" data-a="tgo" data-id="'+o.id+'">'+(o.on?'Turn off':'Turn on')+'</button><button class="btn alt sm bad" data-a="delo" data-id="'+o.id+'">Delete</button></div></td></tr>'}).join(''):'<tr><td colspan="4" class="empty">No offers yet.</td></tr>';
return '<div class="card"><form data-f="addo" class="fm"><label>Code<input name="code" required maxlength="20" style="text-transform:uppercase"></label><label>Discount (%)<input name="pct" type="number" min="1" max="90" required inputmode="numeric"></label><button class="btn" type="submit">Add offer</button></form></div><div class="tb"></div><div class="tw"><table><thead><tr><th>Code</th><th>Discount</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
'<p class="hint">The website currently shows code WELCOME10. Other codes are kept here for your records until the website checks them.</p>'}

function plans(){var p=S.plans,sv=p.bm*12-p.by,pc=p.bm?Math.round(sv/(p.bm*12)*100):0;
return '<div class="card"><form data-f="plans" class="fm"><label>Business, monthly (SAR)<input name="bm" type="number" min="0" required value="'+esc(p.bm)+'"></label><label>Business, yearly (SAR)<input name="by" type="number" min="0" required value="'+esc(p.by)+'"></label><label>New customer discount (%)<input name="disc" type="number" min="0" max="90" required value="'+esc(p.disc)+'"></label><button class="btn" type="submit">Save prices</button></form>'+
'<p class="hint">Yearly saves customers '+money(sv)+' a year ('+pc+'%) compared with paying monthly.</p></div>'+
'<p class="hint">These prices are used to fill new customers in this panel. To change the prices on the website, tell me the new numbers and I will update the site.</p>'}

function sets(){var s=S.set;return '<div class="card"><form data-f="set" class="fm"><label>Business name<input name="name" required value="'+esc(s.name)+'"></label><label>Phone / WhatsApp<input name="phone" type="tel" required value="'+esc(s.phone)+'"></label><label>Email<input name="email" type="email" required value="'+esc(s.email)+'"></label><label>VAT rate (%)<input name="vat" type="number" min="0" max="30" required value="'+esc(s.vat)+'"></label><button class="btn" type="submit">Save</button></form></div>'+
(want?'':'<div class="tb"><button class="btn alt sm bad" data-a="reset">Reset to sample data</button></div>')}

function render(){
document.querySelectorAll('#nv .nb').forEach(function(b){if(b.dataset.t===T)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
var body={dash:dash,cust:cust,leads:leads,offers:offers,plans:plans,set:sets}[T]();
m.innerHTML=(want?'':'<div class="demo">Demo mode: sample data, saved only in this browser. Add your Supabase keys to go live.</div>')+'<h1>'+TT[T][0]+'</h1><p class="sub">'+TT[T][1]+'</p>'+body}

function csv(rows){return rows.map(function(r){return r.map(function(c){var v=String(c==null?'':c);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}).join(',')}).join('\n')}
function dl(name,text){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

var tk={customers:'cust',leads:'leads',offers:'offers'};
function fromDb(t,r){if(t==='customers')return{id:r.id,name:r.name,plan:r.plan,cycle:r.cycle,status:r.status,renew:r.renew,amt:+r.amt};
if(t==='leads')return{id:r.id,name:r.name,phone:r.phone,biz:r.biz||'-',plan:r.plan,status:r.status,date:String(r.created_at).slice(0,10)};
return{id:r.id,code:r.code,pct:r.pct,on:r.active}}
function toDb(t,o){if(t==='customers')return{name:o.name,plan:o.plan,cycle:o.cycle,status:o.status,renew:o.renew,amt:o.amt};
if(t==='leads')return{name:o.name,phone:o.phone,biz:o.biz==='-'?'':o.biz,plan:o.plan,status:o.status};
return{code:o.code,pct:o.pct,active:o.on}}
var api={
add:async function(t,o){if(!live){o.id=uid();return o}var r=await sb.from(t).insert(toDb(t,o)).select().single();if(r.error)throw r.error;return fromDb(t,r.data)},
upd:async function(t,id,p){if(!live)return;var q=('on' in p)?{active:p.on}:p;var r=await sb.from(t).update(q).eq('id',id);if(r.error)throw r.error},
del:async function(t,id){if(!live)return;var r=await sb.from(t).delete().eq('id',id);if(r.error)throw r.error},
setting:async function(k,v){if(!live)return;var r=await sb.from('settings').upsert({key:k,value:v});if(r.error)throw r.error}};
function err(x){toast('Error: '+((x&&x.message)||x))}

document.getElementById('nv').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(b){T=b.dataset.t;render();window.scrollTo(0,0)}});
m.addEventListener('input',function(e){if(e.target.id==='cq')document.getElementById('ctb').innerHTML=crows()});
m.addEventListener('change',async function(e){var t=e.target;
if(t.id==='cs'){document.getElementById('ctb').innerHTML=crows();return}
if(t.dataset.s==='lead'){try{await api.upd('leads',t.dataset.id,{status:t.value});S.leads.forEach(function(l){if(l.id===t.dataset.id)l.status=t.value});save();toast('Status updated')}catch(x){err(x);render()}}});
m.addEventListener('click',async function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,id=b.dataset.id;
if(/^(delc|dell|delo|reset)$/.test(a)&&!b.dataset.sure){b.dataset.sure='1';var t=b.textContent;b.textContent='Tap again to confirm';setTimeout(function(){b.textContent=t;delete b.dataset.sure},3000);return}
if(a==='exp'){if(b.dataset.k==='cust')dl('customers.csv',csv([['Business','Plan','Billing','Status','Renews','SAR per month']].concat(S.cust.map(function(c){return[c.name,c.plan,c.cycle,c.status,c.renew,c.amt]}))));
else dl('leads.csv',csv([['Name','Phone','Business','Plan','Date','Status']].concat(S.leads.map(function(l){return[l.name,l.phone,l.biz,l.plan,l.date,l.status]}))));return}
try{
if(a==='tog'){var c=S.cust.filter(function(x){return x.id===id})[0],ns=c.status==='Active'?'Suspended':'Active';await api.upd('customers',id,{status:ns});c.status=ns}
if(a==='delc'){await api.del('customers',id);S.cust=S.cust.filter(function(x){return x.id!==id})}
if(a==='dell'){await api.del('leads',id);S.leads=S.leads.filter(function(x){return x.id!==id})}
if(a==='delo'){await api.del('offers',id);S.offers=S.offers.filter(function(x){return x.id!==id})}
if(a==='tgo'){var o=S.offers.filter(function(x){return x.id===id})[0],nv=!o.on;await api.upd('offers',id,{on:nv});o.on=nv}
if(a==='reset'){S=seed();toast('Sample data restored')}
}catch(x){err(x);return}
save();render()});
m.addEventListener('submit',async function(e){e.preventDefault();var f=e.target.dataset.f,v=Object.fromEntries(new FormData(e.target)),p=S.plans,btn=e.target.querySelector('button[type=submit]');btn.disabled=true;
try{
if(f==='addc'){var amt=v.amt!==''?+v.amt:(v.plan==='Business'?(v.cycle==='Monthly'?p.bm:p.by/12):0);S.cust.unshift(await api.add('customers',{name:v.name.trim(),plan:v.plan,cycle:v.cycle,status:v.status,renew:d(v.status==='Trial'?14:v.cycle==='Yearly'?365:30),amt:amt}));toast('Customer added')}
if(f==='addl'){S.leads.unshift(await api.add('leads',{name:v.name.trim(),phone:v.phone.trim(),biz:v.biz.trim()||'-',plan:v.plan,status:'New',date:d(0)}));toast('Lead added')}
if(f==='addo'){S.offers.unshift(await api.add('offers',{code:v.code.trim().toUpperCase(),pct:+v.pct,on:true}));toast('Offer added')}
if(f==='plans'){var np={bm:+v.bm,by:+v.by,disc:+v.disc};await api.setting('plans',np);S.plans=np;toast('Prices saved')}
if(f==='set'){var ns={name:v.name.trim(),phone:v.phone.trim(),email:v.email.trim(),vat:+v.vat};await api.setting('set',ns);S.set=ns;toast('Settings saved')}
}catch(x){err(x);btn.disabled=false;return}
save();render()});

var lg=document.getElementById('lg'),app=document.getElementById('app');
function lerr(t){var e=document.getElementById('le');e.textContent=t;e.hidden=!t}
function showApp(){lg.hidden=true;app.hidden=false;document.getElementById('so').hidden=!want;render()}
function showLogin(){app.hidden=true;lg.hidden=false}
async function loadAll(){
var rs=await Promise.all([sb.from('customers').select('*').order('created_at',{ascending:false}),sb.from('leads').select('*').order('created_at',{ascending:false}),sb.from('offers').select('*').order('created_at',{ascending:false}),sb.from('settings').select('*')]);
for(var i=0;i<4;i++)if(rs[i].error)throw rs[i].error;
S.cust=rs[0].data.map(function(r){return fromDb('customers',r)});S.leads=rs[1].data.map(function(r){return fromDb('leads',r)});S.offers=rs[2].data.map(function(r){return fromDb('offers',r)});
rs[3].data.forEach(function(r){if(r.key==='plans')S.plans=r.value;if(r.key==='set')S.set=r.value})}
async function enter(user){
var a=await sb.from('admins').select('user_id').eq('user_id',user.id);
if(a.error||!a.data.length){await sb.auth.signOut();showLogin();lerr('This account is not an admin.');return}
await loadAll();showApp()}
document.getElementById('lf').addEventListener('submit',async function(e){e.preventDefault();lerr('');var v=Object.fromEntries(new FormData(e.target)),b=e.target.querySelector('button');b.disabled=true;
try{var r=await sb.auth.signInWithPassword({email:v.email.trim(),password:v.password});if(r.error)lerr('Wrong email or password.');else await enter(r.data.user)}catch(x){lerr('Something went wrong. Please try again.')}
b.disabled=false});
document.getElementById('so').addEventListener('click',async function(){if(sb)await sb.auth.signOut();location.reload()});
(async function(){
if(!want){showApp();return}
showLogin();
if(!live){lerr('Could not load the sign-in service. Check your internet and reload.');return}
try{var s=await sb.auth.getSession();if(s.data.session)await enter(s.data.session.user)}catch(x){lerr('Could not load data. '+((x&&x.message)||''))}
})();
})();
</script>
