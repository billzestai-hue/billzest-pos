<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BillZestPos — Grocery POS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#f1f5f9;height:100dvh;overflow:hidden}
button,input{font-family:inherit}
.top{height:48px;background:#0b1220;border-bottom:1px solid #1e293b;display:flex;align-items:center;padding:0 12px;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#0f766e,#14b8a6);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.7rem}
.top h1{font-size:.95rem;font-weight:800}
.pill{background:rgba(59,130,246,.15);color:#93c5fd;border:1px solid rgba(59,130,246,.3);padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700}
.shell{display:grid;grid-template-columns:1fr 360px;height:calc(100dvh - 48px)}
.left{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #1e293b}
.dept{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:#111827;border-bottom:1px solid #1e293b}
.dept button{padding:8px 12px;border-radius:8px;border:none;background:#1e3a5f;color:#93c5fd;font-weight:600;font-size:.8rem;cursor:pointer}
.dept button.on{background:#0f766e;color:#fff}
.search{padding:10px;border-bottom:1px solid #1e293b}
.search input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:.9rem}
.list{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #1e293b;cursor:pointer;background:#1e293b}
.row:active{background:#243044}
.row .ic{font-size:1.6rem;width:40px;text-align:center}
.row .inf{flex:1}
.row h4{font-size:.95rem;font-weight:600}
.row small{color:#94a3b8;font-size:.75rem}
.row .pr{font-weight:800;color:#2dd4bf;font-size:1rem}
.row .bq{background:#0f766e;color:#fff;padding:2px 8px;border-radius:8px;font-weight:700;font-size:.8rem}
.right{display:flex;flex-direction:column;background:#111827}
.ch{padding:12px 14px;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;font-weight:700}
.items{flex:1;overflow-y:auto;padding:10px;min-height:80px}
.empty{text-align:center;color:#64748b;padding:20px;font-size:.85rem}
.line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1e293b;font-size:.88rem}
.line .q{display:flex;align-items:center;gap:6px}
.line button{width:26px;height:26px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#fff;font-weight:700;cursor:pointer}
.tot{padding:10px 14px;border-top:1px solid #1e293b}
.tot .r{display:flex;justify-content:space-between;margin-bottom:4px;color:#94a3b8;font-size:.88rem}
.tot .g{display:flex;justify-content:space-between;font-weight:800;font-size:1.2rem;margin-top:6px}
.actions{padding:8px 10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.actions button{padding:10px 6px;border-radius:8px;border:none;font-weight:600;font-size:.75rem;cursor:pointer}
.a1{background:#7f1d1d;color:#fecaca}.a2{background:#9a3412;color:#fed7aa}.a3{background:#1e3a5f;color:#93c5fd}
.keypad{padding:8px 10px 12px;border-top:1px solid #1e293b;background:#0b1220}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{padding:14px 0;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff;font-weight:700;font-size:1.05rem;cursor:pointer}
.keys button:active{background:#334155}
.keys .ok{background:linear-gradient(135deg,#0f766e,#14b8a6);border:none;grid-row:span 2}
.paybar{padding:10px 12px 14px}
.paybtn{width:100%;padding:16px;border:none;border-radius:12px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-weight:800;font-size:1.1rem;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#134e4a;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;opacity:0;transition:.3s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:800px){
  .shell{grid-template-columns:1fr;grid-template-rows:1fr auto}
  body{height:auto;overflow:auto}
  .list{max-height:35vh}
  .right{max-height:55vh;border-top:1px solid #1e293b}
}
</style>
</head>
<body>
<div class="top">
  <div class="logo">BZ</div>
  <h1>BillZestPos</h1>
  <span class="pill">🛒 Grocery / Shop</span>
</div>
<div class="shell">
  <div class="left">
    <div class="dept" id="dept"></div>
    <div class="search" style="display:flex;gap:8px"><button type="button" onclick="openAdd()" style="padding:11px 12px;border:none;border-radius:8px;background:#0f766e;color:#fff;font-weight:700;cursor:pointer">+ Add</button><input id="search" placeholder="Barcode / product..." oninput="render()" onkeydown="if(event.key==='Enter')scan()" style="flex:1;padding:11px 12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:.9rem"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="right">
    <div class="ch"><span>Ticket</span><span id="cnt" style="color:#94a3b8;font-weight:500">0</span></div>
    <div class="items" id="items"><div class="empty">Scan or tap product</div></div>
    <div class="tot" id="tot"></div>
    <div class="actions">
      <button class="a1" onclick="cart=[];render()">Void</button>
      <button class="a2" onclick="toast('Hold ticket')">Hold</button>
      <button class="a3" onclick="toast('Discount')">Discount</button>
    </div>
    <div class="keypad">
      <div class="keys">
        <button type="button" onclick="kp('7')">7</button><button type="button" onclick="kp('8')">8</button><button type="button" onclick="kp('9')">9</button><button type="button" onclick="kp('C')">C</button>
        <button type="button" onclick="kp('4')">4</button><button type="button" onclick="kp('5')">5</button><button type="button" onclick="kp('6')">6</button><button type="button" class="ok" onclick="kp('OK')">OK</button>
        <button type="button" onclick="kp('1')">1</button><button type="button" onclick="kp('2')">2</button><button type="button" onclick="kp('3')">3</button>
        <button type="button" onclick="kp('0')">0</button><button type="button" onclick="kp('00')">00</button><button type="button" onclick="kp('.')">.</button>
      </div>
    </div>
    <div class="paybar">
      <button class="paybtn" onclick="pay()">PAY <span id="amt">0.00</span> SAR</button>
    </div>
  </div>
</div>

<div id="addModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;align-items:center;justify-content:center;padding:16px">
  <div style="background:#1e293b;border-radius:16px;padding:20px;width:100%;max-width:380px;border:1px solid #334155">
    <h3 style="margin-bottom:14px">Add Product</h3>
    <label style="font-size:.8rem;color:#94a3b8">Name</label>
    <input id="aName" style="width:100%;padding:10px;margin:4px 0 10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff">
    <label style="font-size:.8rem;color:#94a3b8">Price (SAR)</label>
    <input id="aPrice" type="number" step="0.01" style="width:100%;padding:10px;margin:4px 0 10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff">
    <label style="font-size:.8rem;color:#94a3b8">Category</label>
    <select id="aCat" style="width:100%;padding:10px;margin:4px 0 10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff">
      <option>Produce</option><option>Dairy</option><option>Grocery</option><option>Retail</option>
    </select>
    <label style="font-size:.8rem;color:#94a3b8">Photo</label>
    <input id="aPhoto" type="file" accept="image/*" style="width:100%;margin:4px 0 10px;color:#94a3b8">
    <div id="aPrev" style="text-align:center;margin-bottom:10px"></div>
    <div style="display:flex;gap:8px">
      <button type="button" onclick="closeAdd()" style="flex:1;padding:12px;border-radius:10px;border:1px solid #334155;background:transparent;color:#94a3b8;cursor:pointer">Cancel</button>
      <button type="button" onclick="saveAdd()" style="flex:1;padding:12px;border-radius:10px;border:none;background:#0f766e;color:#fff;font-weight:700;cursor:pointer">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const STORE='bz_grocery_items_v1';
const defaults=[
  {id:1,n:'Red Pepper',p:4.50,c:'Produce',i:'🌶️',img:''},{id:2,n:'Green Bell Pepper',p:3.50,c:'Produce',i:'🫑',img:''},
  {id:3,n:'Watermelon',p:15.00,c:'Produce',i:'🍉',img:''},{id:4,n:'Apples 1kg',p:12.00,c:'Produce',i:'🍎',img:''},
  {id:5,n:'Bananas 1kg',p:6.00,c:'Produce',i:'🍌',img:''},{id:6,n:'Fresh Milk 1L',p:8.00,c:'Dairy',i:'🥛',img:''},
  {id:7,n:'Yogurt Pack',p:5.50,c:'Dairy',i:'🫙',img:''},{id:8,n:'White Bread',p:3.00,c:'Grocery',i:'🍞',img:''},
  {id:9,n:'Rice 5kg',p:35.00,c:'Grocery',i:'🍚',img:''},{id:10,n:'Olive Oil 500ml',p:28.00,c:'Retail',i:'🫒',img:''},
  {id:11,n:'Tomato Sauce',p:7.00,c:'Grocery',i:'🍅',img:''},{id:12,n:'Eggs 12pc',p:14.00,c:'Dairy',i:'🥚',img:''}
];
let items=[]; try{items=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){}
if(!items.length){items=defaults.slice();localStorage.setItem(STORE,JSON.stringify(items))}
const cats=['All','Produce','Dairy','Grocery','Retail'];
let cat='All', cart=[], buf='', pendingImg='';
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2e3)}
function dept(){document.getElementById('dept').innerHTML=cats.map(c=>`<button class="${c===cat?'on':''}" onclick="cat='${c}';dept();render()">${c}</button>`).join('')}
function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const list=items.filter(x=>(cat==='All'||x.c===cat)&&(!q||x.n.toLowerCase().includes(q)));
  document.getElementById('list').innerHTML=list.map(x=>{
    const line=cart.find(c=>c.id===x.id);
    const ic=x.img?`<img src="${x.img}" style="width:40px;height:40px;object-fit:cover;border-radius:8px">`:`<div class="ic">${x.i||'🛒'}</div>`;
    return `<div class="row" onclick="add(${x.id})">${ic}<div class="inf"><h4>${x.n}</h4><small>${x.c}</small></div><div class="pr">SAR ${Number(x.p).toFixed(2)}</div>${line?`<span class="bq">${line.q}</span>`:''}
    <button type="button" onclick="event.stopPropagation();delItem(${x.id})" style="background:none;border:none;color:#f87171;cursor:pointer;font-size:.75rem">✕</button></div>`;
  }).join('');
  const n=cart.reduce((s,c)=>s+c.q,0);
  document.getElementById('cnt').textContent=n+' items';
  const el=document.getElementById('items');
  if(!cart.length)el.innerHTML='<div class="empty">Scan or tap product</div>';
  else el.innerHTML=cart.map(c=>`<div class="line"><span>${c.n}</span><div class="q"><button onclick="chg(${c.id},-1)">−</button><span>${c.q}</span><button onclick="chg(${c.id},1)">+</button><strong style="color:#2dd4bf;margin-left:8px">SAR ${(c.p*c.q).toFixed(2)}</strong></div></div>`).join('');
  const sub=cart.reduce((s,c)=>s+c.p*c.q,0), vat=sub*.15, tot=sub+vat;
  document.getElementById('tot').innerHTML=`<div class="r"><span>Subtotal</span><span>SAR ${sub.toFixed(2)}</span></div><div class="r"><span>VAT 15%</span><span>SAR ${vat.toFixed(2)}</span></div><div class="g"><span>Total</span><span>SAR ${tot.toFixed(2)}</span></div>`;
  document.getElementById('amt').textContent=tot.toFixed(2);
}
function add(id){const x=items.find(i=>i.id===id);if(!x)return;const l=cart.find(c=>c.id===id);if(l)l.q++;else cart.push({id:x.id,n:x.n,p:x.p,q:1});render()}
function chg(id,d){const l=cart.find(c=>c.id===id);if(!l)return;l.q+=d;if(l.q<=0)cart=cart.filter(c=>c.id!==id);render()}
function pay(){if(!cart.length)return toast('Empty');const tot=cart.reduce((s,c)=>s+c.p*c.q,0)*1.15;toast('PAID SAR '+tot.toFixed(2));cart=[];render()}
function kp(k){if(k==='C'){buf='';document.getElementById('search').value='';render();return}if(k==='OK'){scan();buf='';return}buf+=k;document.getElementById('search').value=buf;render()}
function scan(){const q=(document.getElementById('search').value||'').toLowerCase();const p=items.find(x=>x.n.toLowerCase().includes(q)||String(x.id)===q);if(p){add(p.id);document.getElementById('search').value='';buf='';render()}else toast('Not found')}
function openAdd(){pendingImg='';document.getElementById('aName').value='';document.getElementById('aPrice').value='';document.getElementById('aPrev').innerHTML='';document.getElementById('addModal').style.display='flex'}
function closeAdd(){document.getElementById('addModal').style.display='none'}
document.getElementById('aPhoto').onchange=function(e){const f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>800000){toast('Max 800KB');return;}const r=new FileReader();r.onload=()=>{pendingImg=r.result;document.getElementById('aPrev').innerHTML='<img src="'+pendingImg+'" style="max-height:80px;border-radius:8px">'};r.readAsDataURL(f)};
function saveAdd(){const n=document.getElementById('aName').value.trim();const p=parseFloat(document.getElementById('aPrice').value);const c=document.getElementById('aCat').value;if(!n||!(p>=0)){toast('Name + price required');return;}items.push({id:Date.now(),n,p,c,i:'🛒',img:pendingImg||''});localStorage.setItem(STORE,JSON.stringify(items));closeAdd();dept();render();toast('Product added')}
function delItem(id){if(!confirm('Delete?'))return;items=items.filter(x=>x.id!==id);cart=cart.filter(c=>c.id!==id);localStorage.setItem(STORE,JSON.stringify(items));render();toast('Deleted')}
dept();render();
</script>
</body>
</html>
