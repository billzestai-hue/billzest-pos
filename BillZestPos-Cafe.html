<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BillZestPos — Cafe POS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0f172a;height:100dvh;overflow:hidden}
button,input{font-family:inherit}
.top{height:48px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 12px;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#0f766e,#14b8a6);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.7rem;color:#fff}
.top h1{font-size:.95rem;font-weight:800}
.pill{background:#ccfbf1;color:#0f766e;border:1px solid #99f6e4;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700}
.shell{display:grid;grid-template-columns:1fr 320px;height:calc(100dvh - 48px)}
.main{display:flex;flex-direction:column;overflow:hidden;background:#f8fafc}
.tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid #e2e8f0}
.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid #e2e8f0;background:#fff;color:#64748b;font-weight:600;font-size:.82rem;cursor:pointer}
.tab.on{background:#0f766e;color:#fff;border-color:#0f766e}
.search{padding:10px 12px;background:#fff;border-bottom:1px solid #e2e8f0}
.search input{width:100%;padding:11px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:.9rem;background:#f8fafc}
.grid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;align-content:start}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px;cursor:pointer;text-align:center;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card:active{transform:scale(.97)}
.card .img{font-size:2.8rem;height:80px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border-radius:12px;margin-bottom:8px}
.card h4{font-size:.85rem;font-weight:600;min-height:2.4em;line-height:1.25;margin-bottom:4px}
.card .pr{color:#0f766e;font-weight:800}
.card .qtyrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.card .qtyrow button{width:28px;height:28px;border-radius:50%;border:1px solid #e2e8f0;background:#fff;font-weight:700;cursor:pointer;color:#0f766e}
.badge{position:absolute;top:8px;right:8px;background:#0f766e;color:#fff;min-width:22px;height:22px;border-radius:50%;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.cart{background:#fff;border-left:1px solid #e2e8f0;display:flex;flex-direction:column}
.ch{padding:14px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between}
.ch h2{font-size:1rem;font-weight:700}
.ot{display:flex;gap:8px;padding:10px 14px}
.ot button{flex:1;padding:9px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b;font-weight:600;font-size:.8rem;cursor:pointer}
.ot button.on{background:#ccfbf1;border-color:#14b8a6;color:#0f766e}
.items{flex:1;overflow-y:auto;padding:12px}
.empty{text-align:center;color:#94a3b8;padding:30px 10px;font-size:.88rem}
.line{padding:10px 0;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.line .nm{font-weight:600;font-size:.88rem}
.line .meta{font-size:.75rem;color:#94a3b8;margin-top:2px}
.line .pr{font-weight:700;color:#0f766e;white-space:nowrap}
.tot{padding:12px 14px;border-top:1px solid #e2e8f0;font-size:.88rem}
.tot .r{display:flex;justify-content:space-between;margin-bottom:5px;color:#64748b}
.tot .g{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;margin-top:8px;color:#0f172a}
.pay{padding:12px 14px 16px}
.btn{width:100%;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:.95rem;cursor:pointer;margin-bottom:8px}
.pay-main{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}
.clr{background:#f1f5f9;color:#64748b}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#134e4a;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;opacity:0;transition:.3s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:800px){
  .shell{grid-template-columns:1fr;grid-template-rows:1fr auto}
  body{overflow:auto;height:auto}
  .grid{max-height:40vh}
  .cart{border-left:none;border-top:1px solid #e2e8f0;max-height:50vh}
}
</style>
</head>
<body>
<div class="top">
  <div class="logo">BZ</div>
  <h1>BillZestPos</h1>
  <span class="pill">☕ Cafe / Coffee</span>
</div>
<div class="shell">
  <section class="main">
    <div class="tabs" id="tabs"></div>
    <div class="search" style="display:flex;gap:8px;align-items:center"><button type="button" onclick="openAdd()" style="padding:11px 14px;border:none;border-radius:10px;background:#0f766e;color:#fff;font-weight:700;cursor:pointer;white-space:nowrap">+ Add</button><input id="search" placeholder="Search drinks..." oninput="render()" style="flex:1;padding:11px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:.9rem;background:#f8fafc"></div>
    <div class="grid" id="grid"></div>
  </section>
  <aside class="cart">
    <div class="ch"><h2>Order Summary</h2><span id="cnt" style="color:#94a3b8;font-size:.85rem">0 items</span></div>
    <div class="ot">
      <button type="button" class="on" id="di" onclick="setOT('dine')">Dine In</button>
      <button type="button" id="ta" onclick="setOT('take')">Take Out</button>
    </div>
    <div class="items" id="items"><div class="empty">Add drinks from menu</div></div>
    <div class="tot" id="tot"></div>
    <div class="pay">
      <button class="btn pay-main" onclick="pay()">Proceed to Payment · <span id="amt">0.00</span> SAR</button>
      <button class="btn clr" onclick="cart=[];render()">Clear Order</button>
    </div>
  </aside>
</div>

<div id="addModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:16px;padding:20px;width:100%;max-width:380px">
    <h3 style="margin-bottom:14px">Add Drink / Item</h3>
    <label style="font-size:.8rem;color:#64748b">Name</label>
    <input id="aName" style="width:100%;padding:10px;margin:4px 0 10px;border-radius:8px;border:1px solid #e2e8f0">
    <label style="font-size:.8rem;color:#64748b">Price (SAR)</label>
    <input id="aPrice" type="number" step="0.01" style="width:100%;padding:10px;margin:4px 0 10px;border-radius:8px;border:1px solid #e2e8f0">
    <label style="font-size:.8rem;color:#64748b">Category</label>
    <select id="aCat" style="width:100%;padding:10px;margin:4px 0 10px;border-radius:8px;border:1px solid #e2e8f0">
      <option>Coffee</option><option>Iced</option><option>Tea</option><option>Smoothies</option>
    </select>
    <label style="font-size:.8rem;color:#64748b">Photo</label>
    <input id="aPhoto" type="file" accept="image/*" style="width:100%;margin:4px 0 10px">
    <div id="aPrev" style="text-align:center;margin-bottom:10px"></div>
    <div style="display:flex;gap:8px">
      <button type="button" onclick="closeAdd()" style="flex:1;padding:12px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc;cursor:pointer">Cancel</button>
      <button type="button" onclick="saveAdd()" style="flex:1;padding:12px;border-radius:10px;border:none;background:#0f766e;color:#fff;font-weight:700;cursor:pointer">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const STORE='bz_cafe_items_v1';
const defaults=[
  {id:1,n:'Espresso',p:12,c:'Coffee',i:'☕',img:''},{id:2,n:'Americano',p:14,c:'Coffee',i:'☕',img:''},
  {id:3,n:'Cappuccino',p:18,c:'Coffee',i:'☕',img:''},{id:4,n:'Cafe Latte',p:20,c:'Coffee',i:'🥛',img:''},
  {id:5,n:'Flat White',p:19,c:'Coffee',i:'☕',img:''},{id:6,n:'Mocha',p:21,c:'Coffee',i:'🍫',img:''},
  {id:7,n:'Iced Latte',p:22,c:'Iced',i:'🧊',img:''},{id:8,n:'Iced Mocha',p:24,c:'Iced',i:'🧊',img:''},
  {id:9,n:'Caramel Iced Latte',p:25,c:'Iced',i:'🧋',img:''},{id:10,n:'Green Tea',p:10,c:'Tea',i:'🍵',img:''},
  {id:11,n:'Masala Chai',p:12,c:'Tea',i:'🍵',img:''},{id:12,n:'Mango Smoothie',p:24,c:'Smoothies',i:'🥭',img:''},
  {id:13,n:'Strawberry Smoothie',p:24,c:'Smoothies',i:'🍓',img:''},{id:14,n:'Passion Fruit Tea',p:18,c:'Tea',i:'🍹',img:''}
];
let items=[]; try{items=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){}
if(!items.length){items=defaults.slice();localStorage.setItem(STORE,JSON.stringify(items))}
const cats=['All Items','Coffee','Iced','Tea','Smoothies'];
let cat='All Items', cart=[], ot='dine', pendingImg='';
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2e3)}
function setOT(v){ot=v;document.getElementById('di').classList.toggle('on',v==='dine');document.getElementById('ta').classList.toggle('on',v==='take')}
function tabs(){document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="tab ${c===cat?'on':''}" onclick="cat='${c}';tabs();render()">${c}</button>`).join('')}
function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const list=items.filter(x=>(cat==='All Items'||x.c===cat)&&(!q||x.n.toLowerCase().includes(q)));
  document.getElementById('grid').innerHTML=list.map(x=>{
    const line=cart.find(c=>c.id===x.id);
    const pic=x.img?`<img src="${x.img}" style="width:100%;height:80px;object-fit:cover;border-radius:12px" onclick="add(${x.id})">`:`<div class="img" onclick="add(${x.id})">${x.i||'☕'}</div>`;
    return `<div class="card">${line?`<span class="badge">${line.q}</span>`:''}${pic}<h4 onclick="add(${x.id})">${x.n}</h4><div class="pr" onclick="add(${x.id})">SAR ${Number(x.p).toFixed(2)}</div>
    <div class="qtyrow"><button type="button" onclick="chg(${x.id},-1)">−</button><span style="font-weight:700;min-width:16px">${line?line.q:0}</span><button type="button" onclick="add(${x.id})">+</button></div>
    <button type="button" onclick="delItem(${x.id})" style="margin-top:6px;font-size:.7rem;color:#ef4444;background:none;border:none;cursor:pointer">Delete</button></div>`;
  }).join('');
  const n=cart.reduce((s,c)=>s+c.q,0);
  document.getElementById('cnt').textContent=n+' items';
  const el=document.getElementById('items');
  if(!cart.length)el.innerHTML='<div class="empty">Add drinks from menu</div>';
  else el.innerHTML=cart.map(c=>`<div class="line"><div><div class="nm">${c.n}</div><div class="meta">Qty: ${c.q} × SAR ${c.p.toFixed(2)}</div></div><div class="pr">SAR ${(c.p*c.q).toFixed(2)}</div></div>`).join('');
  const sub=cart.reduce((s,c)=>s+c.p*c.q,0), vat=sub*.15, tot=sub+vat;
  document.getElementById('tot').innerHTML=`<div class="r"><span>Subtotal</span><span>SAR ${sub.toFixed(2)}</span></div><div class="r"><span>VAT 15%</span><span>SAR ${vat.toFixed(2)}</span></div><div class="r"><span>Discount</span><span>SAR 0.00</span></div><div class="g"><span>Total</span><span>SAR ${tot.toFixed(2)}</span></div>`;
  document.getElementById('amt').textContent=tot.toFixed(2);
}
function add(id){const x=items.find(i=>i.id===id);if(!x)return;const l=cart.find(c=>c.id===id);if(l)l.q++;else cart.push({id:x.id,n:x.n,p:x.p,q:1});render()}
function chg(id,d){const l=cart.find(c=>c.id===id);if(!l)return;l.q+=d;if(l.q<=0)cart=cart.filter(c=>c.id!==id);render()}
function pay(){if(!cart.length)return toast('Order empty');const tot=cart.reduce((s,c)=>s+c.p*c.q,0)*1.15;toast('Paid SAR '+tot.toFixed(2));cart=[];render()}
function openAdd(){pendingImg='';document.getElementById('aName').value='';document.getElementById('aPrice').value='';document.getElementById('aPrev').innerHTML='';document.getElementById('addModal').style.display='flex'}
function closeAdd(){document.getElementById('addModal').style.display='none'}
document.getElementById('aPhoto').onchange=function(e){const f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>800000){toast('Max 800KB');return;}const r=new FileReader();r.onload=()=>{pendingImg=r.result;document.getElementById('aPrev').innerHTML='<img src="'+pendingImg+'" style="max-height:80px;border-radius:8px">'};r.readAsDataURL(f)};
function saveAdd(){const n=document.getElementById('aName').value.trim();const p=parseFloat(document.getElementById('aPrice').value);const c=document.getElementById('aCat').value;if(!n||!(p>=0)){toast('Name + price required');return;}items.push({id:Date.now(),n,p,c,i:'☕',img:pendingImg||''});localStorage.setItem(STORE,JSON.stringify(items));closeAdd();tabs();render();toast('Item added')}
function delItem(id){if(!confirm('Delete?'))return;items=items.filter(x=>x.id!==id);cart=cart.filter(c=>c.id!==id);localStorage.setItem(STORE,JSON.stringify(items));render();toast('Deleted')}
tabs();render();
</script>
</body>
</html>
